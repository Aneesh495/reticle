[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reticle"
version = "1.0.0"
description = "Cleanroom Semiconductor Material Control System (MCS), Overhead Hoist Transport (OHT) Fleet Dispatcher, and SEMI SECS/GEM Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aneesh", email = "aneeshkrishnaparthasarathy@gmail.com" }
]
keywords = [
    "secs-gem",
    "semiconductor-automation",
    "material-control-system",
    "amhs",
    "cleanroom-robotics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
reticle = "reticle.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
